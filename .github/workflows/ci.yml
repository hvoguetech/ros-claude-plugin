name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: ros-local (go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race -count=1 ./...
      - name: static builds (macOS + Linux, amd64 + arm64)
        run: |
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build -trimpath -o /dev/null .
          done

  plugin:
    name: plugin manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: claude plugin validate (marketplace + plugin)
        run: |
          npx -y @anthropic-ai/claude-code@2.1.303 plugin validate --strict .
          npx -y @anthropic-ai/claude-code@2.1.303 plugin validate --strict plugins/ros
      - name: repo-specific checks
        run: python3 scripts/check_plugin.py
      - name: shellcheck
        run: |
          command -v shellcheck >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q shellcheck; }
          shellcheck plugins/ros/bin/ros-local install.sh

  goreleaser:
    name: release config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          install-only: true
      # `goreleaser check` exits 2 when the config is valid but uses a deprecated key. We keep `brews` on
      # purpose: a formula installs on macOS and Linux (casks are macOS-oriented) and matches the tap's
      # Formula/ros-local.rb. So accept exactly that outcome and fail on anything else.
      - name: goreleaser check
        run: |
          set +e
          out=$(goreleaser check 2>&1); code=$?
          echo "$out"
          if [ "$code" -eq 0 ]; then exit 0; fi
          if [ "$code" -eq 2 ] && echo "$out" | grep -q "configuration is valid, but uses deprecated properties" \
             && [ "$(echo "$out" | grep -c "DEPRECATED:")" -eq 1 ] && echo "$out" | grep -q "DEPRECATED:.*brews"; then
            echo "::notice::goreleaser config is valid; the only issue is the deliberate 'brews' deprecation"
            exit 0
          fi
          exit "$code"
